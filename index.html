<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pac-man</title>
<style>
  :root { --bg:#05050f; --wall:#2a3cff; --dot:#ffd9a8; --pac:#ffe100; --text:#f4f4ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:"Press Start 2P","Courier New",monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    user-select:none; -webkit-user-select:none;
  }
  #hud { display:flex; justify-content:space-between; width:min(95vw,456px); font-size:13px; letter-spacing:1px; }
  #wrap { position:relative; }
  canvas { display:block; background:#000; border:2px solid var(--wall); border-radius:6px; max-width:95vw; height:auto; }
  #msg {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; background:rgba(0,0,0,.72); text-align:center; font-size:14px; line-height:1.7; padding:16px;
  }
  #msg.hide { display:none; }
  #msg b { color:var(--pac); font-size:20px; }
  button { font:inherit; font-size:12px; background:var(--pac); color:#000; border:0; padding:10px 18px; border-radius:4px; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; }
  #pad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; }
  #pad button { padding:0; font-size:20px; background:#1a1f55; color:#fff; }
  #pad .u{grid-column:2;grid-row:1} #pad .l{grid-column:1;grid-row:2} #pad .d{grid-column:2;grid-row:2} #pad .r{grid-column:3;grid-row:2}
  #help { font-size:9px; opacity:.6; }
  @media (hover:hover) and (pointer:fine) { #pad { display:none; } }
</style>
</head>
<body>
<div id="hud"><span>점수 <span id="score">0</span></span><span>최고 <span id="best">0</span></span><span id="lives"></span></div>
<div id="wrap">
  <canvas id="c" width="456" height="504"></canvas>
  <div id="msg"><b>PAC-MAN</b><span>방향키 / WASD 로 이동<br>P: 일시정지</span><button id="start">게임 시작</button></div>
</div>
<div id="pad">
  <button class="u" data-d="0,-1" aria-label="위">▲</button>
  <button class="l" data-d="-1,0" aria-label="왼쪽">◀</button>
  <button class="d" data-d="0,1" aria-label="아래">▼</button>
  <button class="r" data-d="1,0" aria-label="오른쪽">▶</button>
</div>
<div id="help">모든 점을 먹으면 승리! 파워 펠릿으로 유령을 잡으세요.</div>

<script>
const T = 24;
// # 벽, . 점, o 파워펠릿, ' ' 빈칸, - 유령집 문
const MAP = [
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"   #.#       #.#   ",
"####.# ##-## #.####",
"    .  #   #  .    ",
"####.# ##### #.####",
"   #.#       #.#   ",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"
];
const COLS = 19, ROWS = MAP.length;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = COLS*T; cv.height = ROWS*T;

const $ = id => document.getElementById(id);
let grid, dotsLeft, score, lives, best = +(localStorage.getItem('pacbest')||0) || 0;
let pac, ghosts, state = 'ready', frame = 0, powerT = 0, ghostCombo = 0, msgT = 0;
$('best').textContent = best;

const GHOST_DEF = [
  {c:'#ff2a2a', sx:9, sy:9, scatter:[17,0]},
  {c:'#ffb8ff', sx:8, sy:9, scatter:[1,0]},
  {c:'#00e5ff', sx:10,sy:9, scatter:[17,20]},
  {c:'#ffb852', sx:9, sy:9, scatter:[1,20]},
];
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function loadMap() {
  grid = []; dotsLeft = 0;
  MAP.forEach((row, y) => {
    grid[y] = [];
    for (let x = 0; x < COLS; x++) {
      let ch = row[x] || ' ';
      if (ch === '.' || ch === 'o') dotsLeft++;
      if (ch === 'P') ch = ' ';
      grid[y][x] = ch;
    }
  });
}
function resetActors() {
  pac = { x:9*T+T/2, y:15*T+T/2, dx:0, dy:0, nx:0, ny:0, mouth:0 };
  ghosts = GHOST_DEF.map((g,i) => ({
    ...g, x:g.sx*T+T/2, y:g.sy*T+T/2, dx:0, dy:-1, out:false, release: i*90+30,
    dead:false, color:g.c
  }));
  powerT = 0;
}
function newGame() {
  score = 0; lives = 3; loadMap(); resetActors(); updateHUD();
  state = 'play';
  $('msg').classList.add('hide');
}
function updateHUD() {
  $('score').textContent = score;
  $('lives').textContent = '●'.repeat(Math.max(lives,0)).split('').join(' ');
  $('lives').style.color = '#ffe100';
  if (score > best) { best = score; $('best').textContent = best; try{localStorage.setItem('pacbest',best)}catch(e){} }
}

const isWall = (cx, cy, ghost) => {
  if (cx < 0 || cx >= COLS) return false; // 터널
  if (cy < 0 || cy >= ROWS) return true;
  const c = grid[cy][cx];
  if (c === '#') return true;
  if (c === '-') return !ghost;
  return false;
};
const atCenter = o => Math.abs((o.x % T) - T/2) < 0.01 && Math.abs((o.y % T) - T/2) < 0.01;

function movePac() {
  const sp = 2;
  if (atCenter(pac)) {
    const cx = Math.floor(pac.x/T), cy = Math.floor(pac.y/T);
    // 점 먹기
    const c = grid[cy] && grid[cy][cx];
    if (c === '.') { grid[cy][cx] = ' '; score += 10; dotsLeft--; updateHUD(); }
    else if (c === 'o') { grid[cy][cx] = ' '; score += 50; dotsLeft--; powerT = 420; ghostCombo = 0; updateHUD();
      ghosts.forEach(g => { if (!g.dead) { g.dx *= -1; g.dy *= -1; } }); }
    if (dotsLeft <= 0) { state = 'win'; showMsg('<b>클리어!</b>점수 '+score); return; }
    if ((pac.nx || pac.ny) && !isWall(cx+pac.nx, cy+pac.ny)) { pac.dx = pac.nx; pac.dy = pac.ny; }
    if (isWall(cx+pac.dx, cy+pac.dy)) { pac.dx = 0; pac.dy = 0; }
  } else if (pac.nx === -pac.dx && pac.ny === -pac.dy && (pac.nx||pac.ny)) {
    pac.dx = pac.nx; pac.dy = pac.ny; // 즉시 반대 방향
  }
  pac.x += pac.dx*sp; pac.y += pac.dy*sp;
  if (pac.x < -T/2) pac.x = COLS*T + T/2 - 2; else if (pac.x > COLS*T + T/2) pac.x = -T/2 + 2;
  if (pac.dx || pac.dy) pac.mouth += 0.25;
}

// 목표 칸에서 각 칸까지의 실제 길 거리 (터널 포함)
function bfs(tx, ty, doorOK) {
  const dist = Array.from({length: ROWS}, () => []);
  dist[ty][tx] = 0;
  const q = [[tx, ty]];
  for (let h = 0; h < q.length; h++) {
    const [x, y] = q[h];
    for (const [dx, dy] of DIRS) {
      let nx = x + dx; const ny = y + dy;
      if (nx < 0) nx = COLS - 1; else if (nx >= COLS) nx = 0;
      if (ny < 0 || ny >= ROWS) continue;
      const c = grid[ny][nx];
      if (c === '#' || (c === '-' && !doorOK)) continue;
      if (dist[ny][nx] !== undefined) continue;
      dist[ny][nx] = dist[y][x] + 1;
      q.push([nx, ny]);
    }
  }
  return dist;
}

function ghostTarget(g, i) {
  if (g.dead) return [9, 9];
  const phase = (frame % 1500) < 180; // 초반 짧은 분산 모드
  if (phase) return g.scatter;
  const px = Math.floor(pac.x/T), py = Math.floor(pac.y/T);
  if (i === 0) return [px, py];
  if (i === 1) return [px + pac.dx*4, py + pac.dy*4];
  if (i === 2) { const b = ghosts[0]; return [px*2 - Math.floor(b.x/T), py*2 - Math.floor(b.y/T)]; }
  const d = Math.hypot(px - g.x/T, py - g.y/T);
  return d > 6 ? [px, py] : g.scatter;
}
function moveGhost(g, i) {
  if (g.release > 0) { g.release--; return; }
  const frightened = powerT > 0 && !g.dead;
  const sp = g.dead ? 4 : frightened ? 1 : 1.5;
  let steps = sp;
  while (steps > 0) {
    const s = Math.min(steps, 0.5); steps -= s;
    if (atCenter(g)) {
      const cx = Math.round((g.x - T/2)/T), cy = Math.round((g.y - T/2)/T);
      if (g.dead && cx === 9 && cy === 9) g.dead = false;
      if (!g.out && cy <= 7) g.out = true;
      const opts = DIRS.filter(([dx,dy]) => !(dx === -g.dx && dy === -g.dy) && !isWall(cx+dx, cy+dy, g.dead || !g.out));
      let pick;
      if (!opts.length) pick = [-g.dx, -g.dy];
      else if (frightened) pick = opts[Math.floor(Math.random()*opts.length)];
      else {
        let [tx, ty] = g.out || g.dead ? ghostTarget(g, i) : [9, 7];
        tx = Math.round(tx); ty = Math.round(ty);
        if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS || grid[ty][tx] === '#') {
          tx = Math.floor(pac.x/T); ty = Math.floor(pac.y/T);
        }
        const doorOK = g.dead || !g.out;
        const dist = bfs(tx, ty, doorOK);
        pick = opts.reduce((b, o) => {
          let nx = cx+o[0]; if (nx < 0) nx = COLS-1; else if (nx >= COLS) nx = 0;
          const d = dist[cy+o[1]] ? dist[cy+o[1]][nx] : undefined;
          const v = d === undefined ? 1e6 + Math.random() : d;
          return v < b.d ? {d:v, o} : b;
        }, {d:1e9}).o;
      }
      g.dx = pick[0]; g.dy = pick[1];
    }
    g.x += g.dx*s; g.y += g.dy*s;
    if (g.x < -T/2) g.x = COLS*T + T/2 - 1; else if (g.x > COLS*T + T/2) g.x = -T/2 + 1;
  }
}

function collide() {
  for (const g of ghosts) {
    if (g.release > 0 || g.dead) continue;
    if (Math.hypot(g.x - pac.x, g.y - pac.y) < T*0.7) {
      if (powerT > 0) {
        g.dead = true; ghostCombo++; score += 200 * ghostCombo; updateHUD();
      } else {
        lives--; updateHUD();
        if (lives <= 0) { state = 'over'; showMsg('<b>게임 오버</b>점수 '+score); }
        else { state = 'dead'; msgT = 70; }
        return;
      }
    }
  }
}
function showMsg(html) {
  const m = $('msg');
  m.innerHTML = html + '<button id="again">다시 하기</button>';
  m.classList.remove('hide');
  $('again').onclick = newGame;
}

function update() {
  frame++;
  if (state === 'dead') { if (--msgT <= 0) { resetActors(); state = 'play'; } return; }
  if (state !== 'play') return;
  if (powerT > 0) powerT--;
  movePac();
  if (state !== 'play') return;
  ghosts.forEach(moveGhost);
  collide();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!grid) return;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x], px = x*T, py = y*T;
    if (c === '#') {
      ctx.fillStyle = '#10166e'; ctx.fillRect(px+1, py+1, T-2, T-2);
      ctx.strokeStyle = '#2a3cff'; ctx.lineWidth = 2; ctx.strokeRect(px+3, py+3, T-6, T-6);
    } else if (c === '-') {
      ctx.fillStyle = '#ffb8ff'; ctx.fillRect(px, py+T/2-2, T, 4);
    } else if (c === '.') {
      ctx.fillStyle = '#ffd9a8'; ctx.beginPath(); ctx.arc(px+T/2, py+T/2, 2.5, 0, 7); ctx.fill();
    } else if (c === 'o' && (frame % 30 < 20)) {
      ctx.fillStyle = '#ffd9a8'; ctx.beginPath(); ctx.arc(px+T/2, py+T/2, 7, 0, 7); ctx.fill();
    }
  }
  // 팩맨
  const a = (Math.sin(pac.mouth)+1)/2 * 0.8 + 0.05;
  const ang = Math.atan2(pac.dy || 0, pac.dx || 1);
  ctx.fillStyle = '#ffe100'; ctx.beginPath();
  if (state === 'dead') {
    const k = Math.min(1, 1 - msgT/70) * Math.PI;
    ctx.moveTo(pac.x, pac.y); ctx.arc(pac.x, pac.y, T/2-2, -Math.PI/2 + k, -Math.PI/2 - k + Math.PI*2);
  } else {
    ctx.moveTo(pac.x, pac.y); ctx.arc(pac.x, pac.y, T/2-2, ang + a, ang - a + Math.PI*2);
  }
  ctx.closePath(); ctx.fill();
  // 유령
  ghosts.forEach(g => {
    if (state === 'dead') return;
    const fright = powerT > 0 && !g.dead;
    const blink = fright && powerT < 120 && frame % 20 < 10;
    const r = T/2 - 2;
    if (!g.dead) {
      ctx.fillStyle = fright ? (blink ? '#fff' : '#2233ff') : g.color;
      ctx.beginPath(); ctx.arc(g.x, g.y - 1, r, Math.PI, 0);
      ctx.lineTo(g.x + r, g.y + r);
      const w = (r*2)/3;
      for (let i = 0; i < 3; i++) {
        const sx = g.x + r - i*w;
        ctx.lineTo(sx - w/2, g.y + r - 4 + (frame % 16 < 8 ? 0 : 2));
        ctx.lineTo(sx - w, g.y + r);
      }
      ctx.closePath(); ctx.fill();
    }
    // 눈
    ctx.fillStyle = '#fff';
    [-4, 4].forEach(o => { ctx.beginPath(); ctx.arc(g.x+o, g.y-3, 3, 0, 7); ctx.fill(); });
    ctx.fillStyle = fright ? '#f00' : '#112';
    [-4, 4].forEach(o => { ctx.beginPath(); ctx.arc(g.x+o+g.dx*1.5, g.y-3+g.dy*1.5, 1.5, 0, 7); ctx.fill(); });
  });
  if (state === 'play' && frame < 1 ) return;
}

// 입력
const KEYS = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
function setDir(d) { if (pac) { pac.nx = d[0]; pac.ny = d[1]; } }
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k]) { e.preventDefault(); setDir(KEYS[k]); }
  else if (k === 'p' && (state === 'play' || state === 'pause')) {
    state = state === 'play' ? 'pause' : 'play';
    if (state === 'pause') showPause(); else $('msg').classList.add('hide');
  } else if ((k === 'Enter' || k === ' ') && state === 'ready') newGame();
});
function showPause() { const m = $('msg'); m.innerHTML = '<b>일시정지</b>P 키로 계속'; m.classList.remove('hide'); }
document.querySelectorAll('#pad button').forEach(b => {
  const h = e => { e.preventDefault(); setDir(b.dataset.d.split(',').map(Number)); };
  b.addEventListener('touchstart', h, {passive:false}); b.addEventListener('mousedown', h);
});
// 스와이프
let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive:true});
cv.addEventListener('touchend', e => {
  if (!t0) return; const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  setDir(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
});
$('start').onclick = newGame;

// 60fps 고정 루프
let last = 0, acc = 0;
function loop(ts) {
  acc += Math.min(ts - last, 100); last = ts;
  while (acc >= 1000/60) { update(); acc -= 1000/60; }
  draw(); requestAnimationFrame(loop);
}
loadMap(); resetActors(); updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
